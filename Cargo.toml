[package]
name = "remoteworker-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "_native"
path = "rust/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
pyo3 = { version = "=0.27.2", features = ["abi3-py312"] }
serde_json = "1"
url = "2"

[features]
extension-module = ["pyo3/extension-module"]
