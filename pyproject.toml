[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "remoteworker-native"
version = "0.1.0"
requires-python = ">=3.12"

[tool.maturin]
python-source = "."
module-name = "remoteworker._native"
features = ["extension-module"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F"]
